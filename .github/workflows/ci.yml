name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --workspace -- -D warnings

      - name: Security audit
        run: |
          cargo install cargo-audit --quiet 2>/dev/null || true
          # Ignore list, each with justification. Re-review on every
          # uniffi / rand bump; aim to empty this list.
          #
          # RUSTSEC-2025-0141 (bincode 1.3.3): transitive via uniffi_macros 0.28;
          #   build-time only (proc-macro), not shipped. Clears on uniffi ≥ 0.29.
          # RUSTSEC-2024-0436 (paste 1.0.15 unmaintained): transitive via
          #   uniffi_core 0.28; declarative macros only, no runtime surface.
          #   Clears on uniffi ≥ 0.29.
          # RUSTSEC-2026-0097 (rand 0.8.5 unsound): only triggers when a
          #   custom logger calls `rand::rng()`; we don't install custom
          #   loggers. Clears when tungstenite 0.25+ drops rand 0.8.
          cargo audit \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0097

      - name: Build release
        run: cargo build --release --workspace

  rust-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cov-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --quiet

      - name: Generate coverage
        run: cargo tarpaulin --workspace --timeout 300 --out xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  ios-build:
    name: iOS Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust library for iOS Simulator
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        run: |
          IOS_SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          MACOS_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          CLANG="$(xcrun --find clang)"
          AR_BIN="$(xcrun --find ar)"
          # Globally target iOS-sim so gmp-mpfr-sys's C sources (which
          # ignore cargo's target-scoped CC_<triple> vars) pick it up.
          # CC_FOR_BUILD / HOST_CC point at a macOS-SDK clang so GMP's
          # autoconf "build system compiler" probe can compile+run
          # conftest binaries on the arm64 macOS runner. Without this,
          # configure dies with "Specified CC_FOR_BUILD doesn't seem
          # to work".
          export CC="$CLANG"
          export CFLAGS="-target arm64-apple-ios14.0-simulator -isysroot $IOS_SIM_SDK -arch arm64"
          export AR="$AR_BIN"
          export CC_FOR_BUILD="$CLANG"
          export HOST_CC="$CLANG"
          export CFLAGS_FOR_BUILD="-isysroot $MACOS_SDK -arch arm64"
          export CPPFLAGS_FOR_BUILD="-isysroot $MACOS_SDK"
          export LDFLAGS_FOR_BUILD="-isysroot $MACOS_SDK"
          cargo build --lib -p horcrux-core --target aarch64-apple-ios-sim

      - name: Copy library to Frameworks
        run: |
          mkdir -p ios/Horcrux/Core/Frameworks
          cp target/aarch64-apple-ios-sim/debug/libhorcrux_core.a ios/Horcrux/Core/Frameworks/

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS app
        working-directory: ios
        run: |
          xcodebuild build-for-testing \
            -project Horcrux.xcodeproj \
            -scheme Horcrux \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run unit tests
        working-directory: ios
        run: |
          xcodebuild test \
            -project Horcrux.xcodeproj \
            -scheme Horcrux \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
