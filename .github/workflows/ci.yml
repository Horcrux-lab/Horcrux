name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        # Run even if `cargo fmt --check` failed above so lint regressions
        # don't hide behind a formatting nit (fail-fast independently).
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace -- -D warnings

      - name: Security audit
        run: |
          cargo install cargo-audit --quiet 2>/dev/null || true
          # Ignore list, each with justification. Re-review on every
          # uniffi / rand bump; aim to empty this list.
          #
          # RUSTSEC-2025-0141 (bincode 1.3.3): transitive via uniffi_macros 0.28;
          #   build-time only (proc-macro), not shipped. Clears on uniffi ≥ 0.29.
          # RUSTSEC-2024-0436 (paste 1.0.15 unmaintained): transitive via
          #   uniffi_core 0.28; declarative macros only, no runtime surface.
          #   Clears on uniffi ≥ 0.29.
          # RUSTSEC-2026-0097 (rand 0.8.5 unsound): only triggers when a
          #   custom logger calls `rand::rng()`; we don't install custom
          #   loggers. Clears when tungstenite 0.25+ drops rand 0.8.
          # RUSTSEC-2025-0127 (cggmp21 presignature misuse): the two attack
          #   vectors require calling `Presignature::set_derivation_path` or
          #   `Presignature::issue_partial_signature` with a hash-only input.
          #   We never use presignatures — our MPC signing flow always takes
          #   a full message and goes through the single-shot sign API. Ripped
          #   grep of horcrux-core confirms no Presignature/set_derivation_path
          #   references. Planned migration to cggmp24 tracked in Phase 2.
          cargo audit \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0097 \
            --ignore RUSTSEC-2025-0127

      - name: Build release
        run: cargo build --release --workspace

  rust-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cov-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --quiet

      - name: Generate coverage
        # `| tee` makes the step's status tee's without pipefail — the exact
        # masking that made the iOS gate green while tests failed. Set it.
        run: |
          set -euo pipefail
          cargo tarpaulin --workspace --timeout 900 --out xml | tee tarpaulin.log

      # The number has to land somewhere the repository can see without a
      # third-party account. Every Codecov upload from this repo has failed
      # with "Token required because branch is protected" while the step
      # itself stayed green (fail_ci_if_error: false), so from the outside
      # this job looked like a working coverage gate for its entire life
      # while publishing nothing at all. Writing the summary here means the
      # figure survives regardless of what Codecov does.
      #
      # `tee` rather than a plain redirect so the figure lands in the job log
      # too: the log is readable through the API and from a terminal, the step
      # summary is only ever visible in the web UI.
      - name: Summarise coverage
        if: always()
        run: |
          line="$(grep -E '% coverage, [0-9]+/[0-9]+ lines covered' tarpaulin.log || true)"
          if [ -z "$line" ]; then
            echo "::warning::no coverage line in tarpaulin.log; reporting the tail instead"
            line="$(tail -20 tarpaulin.log 2>/dev/null || echo '(coverage step produced no output)')"
          fi
          {
            echo '## Rust coverage'
            echo
            echo '```'
            echo "$line"
            echo '```'
            echo
            echo 'Note: `#[ignore]`d tests do not run here, so the CGGMP21'
            echo 'ceremony paths they cover (notably `mpc/refresh.rs`) are'
            echo 'reported as uncovered. Those run in `mpc-e2e.yml` on'
            echo 'release tags.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # `secrets` is not available in a step-level `if`, so the presence
      # check has to go through an output.
      - name: Check for a Codecov token
        id: codecov_token
        env:
          TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Gated on the token existing. Without it the action makes three API
      # calls that all fail, prints three errors, and returns success —
      # noise that reads like a working upload. Skipping says so plainly,
      # and when a token is present a failed upload is now a real failure.
      - name: Upload to Codecov
        if: steps.codecov_token.outputs.present == 'true'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          fail_ci_if_error: true

      - name: Note the missing Codecov token
        if: steps.codecov_token.outputs.present != 'true'
        run: |
          echo "::notice::CODECOV_TOKEN is not set, so coverage was not uploaded." \
               "The codecov.yml project/patch gates cannot run without it;" \
               "the figure in the job summary is the only coverage signal" \
               "this job produces."

  ios-build:
    name: iOS Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # macos-15 defaults to Xcode 16.4, but it also ships iOS 26.x simulator
      # runtimes, and `OS=latest` in the destination below selects the newest
      # of those. Xcode 16.4's XCTest cannot inject into an iOS 26.2 runtime:
      # the host app aborted on an uncaught NSException before a single test
      # ran ("Test crashed with signal abrt before starting test execution").
      # Selecting the newest installed Xcode makes the pair self-consistent
      # and closes the gap with local development, which is on Xcode 26.x —
      # Swift 6.1.2 here already rejected code that compiles locally.
      # Picked by sort rather than pinned so an image refresh cannot strand us
      # on a version that has been removed.
      - name: Select Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "No Xcode 26.x found; leaving the default selected." >&2
            ls -d /Applications/Xcode*.app >&2
          else
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version
          swift --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust library for iOS Simulator
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        run: |
          IOS_SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          MACOS_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          CLANG="$(xcrun --find clang)"
          AR_BIN="$(xcrun --find ar)"

          # gmp-mpfr-sys calls CC_FOR_BUILD with no flags, so we wrap
          # it via `xcrun --sdk macosx clang`. xcrun injects the
          # correct SDKROOT into the subprocess so ld64 produces a
          # properly ad-hoc-signed arm64 macOS binary; without the
          # signature macOS Sequoia SIGKILLs it on exec.
          HOST_CC_WRAPPER="$RUNNER_TEMP/host-cc.sh"
          printf '%s\n' \
            '#!/bin/bash' \
            'unset IPHONEOS_DEPLOYMENT_TARGET CFLAGS SDKROOT' \
            'export MACOSX_DEPLOYMENT_TARGET=14.0' \
            'exec /usr/bin/xcrun --sdk macosx clang "$@"' \
            > "$HOST_CC_WRAPPER"
          chmod +x "$HOST_CC_WRAPPER"

          export CC="$CLANG"
          export CFLAGS="-target arm64-apple-ios14.0-simulator -isysroot $IOS_SIM_SDK -arch arm64"
          export AR="$AR_BIN"
          export CC_FOR_BUILD="$HOST_CC_WRAPPER"
          export HOST_CC="$HOST_CC_WRAPPER"

          echo "=== Verifying CC_FOR_BUILD wrapper ==="
          echo 'int main(){return 0;}' > "$RUNNER_TEMP/probe.c"
          "$CC_FOR_BUILD" "$RUNNER_TEMP/probe.c" -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"

          cargo build --lib -p horcrux-core --target aarch64-apple-ios-sim || {
            echo "=== GMP config.log (last 100 lines) ==="
            find target -name config.log -path '*gmp-build*' -exec tail -100 {} \; || true
            echo "=== xcrun env ==="
            xcrun --sdk macosx --show-sdk-path || true
            /usr/bin/clang --version || true
            exit 1
          }

      - name: Copy library to Frameworks
        run: |
          mkdir -p ios/Horcrux/Core/Frameworks
          cp target/aarch64-apple-ios-sim/debug/libhorcrux_core.a ios/Horcrux/Core/Frameworks/

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS app
        working-directory: ios
        run: |
          # `bash -e` (the Actions default) does not set pipefail, so without
          # this the step's exit status is xcpretty's — always 0 — and a failed
          # build reports success. Verified: this job logged "** TEST FAILED **"
          # while GitHub showed a green check.
          set -euo pipefail
          # No CODE_SIGNING_ALLOWED=NO. Suppressing signing also suppresses the
          # simulated entitlements Xcode injects for a simulator build, and
          # without `application-identifier` every Keychain call returns
          # errSecMissingEntitlement (-34018) — ten tests' worth. Simulator
          # builds ad-hoc sign with no team or profile, so allowing it costs
          # nothing here.
          xcodebuild build-for-testing \
            -project Horcrux.xcodeproj \
            -scheme Horcrux \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            | xcpretty

      - name: Run unit tests
        working-directory: ios
        run: |
          # See the build step above: without pipefail this gate cannot fail.
          set -euo pipefail
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project Horcrux.xcodeproj \
            -scheme Horcrux \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            | xcpretty

      # Swift coverage was never measured anywhere. codecov.yml sets a 70%
      # patch target and justifies it by reasoning about "the large
      # proportion of pure SwiftUI view code", but the only report ever
      # generated was `cargo tarpaulin`, which sees no Swift at all — so the
      # bar was written for a language the pipeline never looked at. The app
      # target measured 10.6% line coverage the first time anyone ran this.
      #
      # Reporting the two targets separately matters: HorcruxTests.xctest
      # scores ~94% because tests execute themselves, and averaging that
      # against the app flatters the number by a wide margin. Horcrux.app is
      # the figure that means anything.
      - name: Summarise iOS coverage
        if: always()
        working-directory: ios
        run: |
          set +e
          if [ ! -d TestResults.xcresult ]; then
            echo "::notice::no result bundle; coverage not measured"
            exit 0
          fi
          report="$(xcrun xccov view --report --only-targets TestResults.xcresult 2>&1)"
          if [ $? -ne 0 ] || [ -z "$report" ]; then
            echo "::warning::xccov could not read TestResults.xcresult; see the job summary"
            report="${report:-(xccov produced no output)}"
          fi
          {
            echo '## iOS coverage'
            echo
            echo '```'
            echo "$report"
            echo '```'
            echo
            echo 'Only `Horcrux.app` is meaningful — `HorcruxTests.xctest`'
            echo 'measures the tests executing themselves.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # xcpretty swallows everything but the summary line, so a launch-time
      # abort reaches the log as a bare "Test crashed with signal abrt before
      # starting test execution" with no reason attached. Dump the toolchain,
      # the crash report and the simulator's own log for the host app so the
      # next failure is diagnosable from the run page alone.
      - name: Diagnose iOS test failure
        if: failure()
        run: |
          set +e
          echo "=== toolchain ==="
          xcodebuild -version
          swift --version

          echo "=== simulator runtimes ==="
          xcrun simctl list devices available | head -40

          echo "=== crash reports ==="
          found=0
          for dir in "$HOME/Library/Logs/DiagnosticReports" \
                     "$HOME/Library/Logs/CoreSimulator"; do
            while IFS= read -r f; do
              found=1
              echo "--- $f (fields) ---"
              # An .ips is a JSON header line plus a JSON body whose thread
              # dumps dwarf everything else, so `head` misses the fields that
              # actually name the failure. Split on commas and pull those out.
              tr ',' '\n' < "$f" \
                | grep -aE '"(termination|asi|exception|exitReason|reason|indicator|is_corpse|procName)"' \
                | head -40
              echo "--- $f (exception backtrace symbols) ---"
              tr ',' '\n' < "$f" | grep -a '"symbol"' | head -30
            done < <(find "$dir" -name 'Horcrux*' -mmin -60 2>/dev/null)
          done
          [ "$found" -eq 0 ] && echo "(no Horcrux crash report found)"

          echo "=== host app log from the booted simulator ==="
          xcrun simctl spawn booted log show --style compact --last 20m \
            --predicate 'process == "Horcrux"' 2>/dev/null | tail -120 \
            || echo "(no booted simulator)"
          exit 0
