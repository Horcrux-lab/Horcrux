[workspace]
resolver = "2"
members = [
    "horcrux-core",
    "horcrux-relay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Crypto primitives
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Elliptic curves
k256 = { version = "0.13", features = ["ecdsa", "arithmetic", "serde"] }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hex encoding
hex = "0.4"
