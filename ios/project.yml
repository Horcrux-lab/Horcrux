name: Horcrux
options:
  bundleIdPrefix: com.horcrux
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    OTHER_LDFLAGS:
      - "-lhorcrux_core"
    LIBRARY_SEARCH_PATHS:
      - "$(PROJECT_DIR)/Horcrux/Core/Frameworks"
    SWIFT_INCLUDE_PATHS:
      - "$(PROJECT_DIR)/Horcrux/Core/Generated"
    HEADER_SEARCH_PATHS:
      - "$(PROJECT_DIR)/Horcrux/Core/Generated"

targets:
  Horcrux:
    type: application
    platform: iOS
    sources:
      - path: Horcrux
        excludes:
          - "Core/Frameworks/**"
          - "Core/Generated/horcrux_coreFFI.h"
          - "Core/Generated/horcrux_coreFFI.modulemap"
    settings:
      base:
        INFOPLIST_FILE: Horcrux/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.horcrux.wallet
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Horcrux/Resources/Info.plist
      properties:
        CFBundleName: Horcrux
        CFBundleDisplayName: Horcrux
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Horcrux uses Bluetooth to communicate with nearby devices for key shard creation and signing."
        NSBluetoothPeripheralUsageDescription: "Horcrux uses Bluetooth to communicate with nearby devices."
        NSLocalNetworkUsageDescription: "Horcrux uses local network to discover and communicate with nearby devices."
        NSBonjourServices:
          - "_horcrux._tcp"
        NSCameraUsageDescription: "Horcrux uses the camera to scan QR codes for peer discovery."
        NSFaceIDUsageDescription: "Horcrux uses Face ID to protect your key shards."
    dependencies: []

  HorcruxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HorcruxTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horcrux.wallet.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Horcrux
