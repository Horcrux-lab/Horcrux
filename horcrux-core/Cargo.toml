[package]
name = "horcrux-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MPC threshold signature core library for the Horcrux wallet"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "horcrux_core"

[dependencies]
# Workspace deps
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rand.workspace = true
sha2.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
x25519-dalek.workspace = true
k256.workspace = true
ed25519-dalek.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
hex.workspace = true

# MPC protocol deps (will be expanded in Phase 1.2)
# curv-kzen = { version = "0.10" }

# Shamir secret sharing
vsss-rs = { version = "4", features = ["std"] }

# UniFFI for mobile bindings
uniffi = { version = "0.28", features = ["cli"] }

# Noise Protocol Framework (E2E encryption — replaces hand-rolled X25519+AES-GCM+Ed25519)
snow = "0.10"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# FROST Ed25519 threshold signatures (IETF RFC 9591)
frost-ed25519 = { version = "2.2", features = ["serde"] }

# CGGMP21 threshold ECDSA (audited by Kudelski)
cggmp21 = { version = "0.6", features = ["state-machine", "curve-secp256k1"] }
round-based = "0.4"
generic-ec = { version = "0.4", features = ["serde", "curve-secp256k1"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Base64
base64 = "0.22"

# Chain-specific encoding
tiny-keccak = { version = "2", features = ["keccak"] }
bs58 = "0.5"
bech32 = "0.11"
ripemd = "0.1"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
