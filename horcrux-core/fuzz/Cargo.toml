[package]
name = "horcrux-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
horcrux-core = { path = ".." }
serde_json = "1"

# Prevent this crate from being pulled into the parent cargo workspace —
# cargo-fuzz manages its own Cargo.lock and build profile here.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "evm_calldata"
path = "fuzz_targets/evm_calldata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shard_decrypt"
path = "fuzz_targets/shard_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "noise_handshake"
path = "fuzz_targets/noise_handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mpc_payload"
path = "fuzz_targets/mpc_payload.rs"
test = false
doc = false
bench = false
