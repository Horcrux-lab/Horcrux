# cargo-deny configuration for Horcrux.
#
# Run locally:
#   cargo install cargo-deny
#   cargo deny check
#
# Covers four concerns:
#   advisories — CVE / RustSec advisory gate
#   bans       — duplicate / banned crate gate
#   licenses   — license allow-list (must be MIT-compatible)
#   sources    — only allow crates.io + git (no vendored / private registries)
#
# This complements `cargo audit` (already in CI) by adding license +
# duplicate-crate hygiene. Historically-ignored advisories are kept in
# sync with .github/workflows/ci.yml — update both when rotating the
# ignore list.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # bincode 1.3.3: build-time only (proc-macro via uniffi_macros 0.28).
    "RUSTSEC-2025-0141",
    # paste 1.0.15 unmaintained: declarative macros only (uniffi_core 0.28).
    "RUSTSEC-2024-0436",
    # rand 0.8.5 unsoundness: only triggers via custom logger rand::rng();
    # we don't install custom loggers. Clears when tungstenite 0.25+ drops rand 0.8.
    "RUSTSEC-2026-0097",
    # cggmp21 presignature misuse: we never use presignatures.
    # Migration to cggmp24 tracked in Phase 2 roadmap.
    "RUSTSEC-2025-0127",
    # atomic-polyfill unmaintained: transitive via frost-core →
    # postcard → heapless ≤ 0.7. Sound on our targets (iOS arm64
    # + Linux x86_64/arm64 have native atomics so the polyfill is
    # a no-op). Clears on frost-core bump to heapless 0.8+.
    "RUSTSEC-2023-0089",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "OpenSSL",
    # gmp-mpfr-sys / rug (Paillier ZK dependencies of cggmp21). LGPL
    # permits dynamic-linking in MIT downstream; Horcrux links these
    # via FFI and does not modify or redistribute the GMP/MPFR sources.
    "LGPL-3.0",
    "LGPL-3.0-or-later",
]
confidence-threshold = 0.8
exceptions = []

# ring's license combo (BSD-style + ISC + OpenSSL-style) is manually
# cleared here; it has been audited upstream.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
# Wildcards are denied for external dependencies but workspace path
# deps are expected to use version-less paths — see allow-wildcard-paths
# below.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Known duplicates introduced by large transitive graphs (cggmp21,
# tungstenite). Downgrade these specific cases from error to allowed
# so that a genuine duplicate regression in first-party code surfaces.
allow = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
